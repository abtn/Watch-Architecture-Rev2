[project]
name = "watch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2,<3",
    "alembic>=1",
    "psycopg[binary]>=3",
]

[dependency-groups]
dev = [
    "mypy>=1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["core"]
